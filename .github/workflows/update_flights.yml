name: Weekly Real Flights Timetable Sync

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unified real-world scraper
        run: |
          python scripts/update_all_flights.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add flights.json scripts/airports.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'chore(data): weekly automated flight schedule sync' && git push)
