name: Daily Real Flights Timetable Sync

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC (Rolling 7-day schedule sync)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run global real-world rolling scraper
        run: |
          python scripts/update_all_flights.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add flights.json metadata.json airports.json scripts/airports.json
          if ! git diff --staged --quiet; then
            git commit -m 'chore(data): daily automated global flight schedule sync'
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
