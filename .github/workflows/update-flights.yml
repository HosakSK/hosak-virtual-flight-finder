name: Monthly Flight Schedules & Callsigns Update

on:
  schedule:
    # Runs at 03:00 UTC on the 1st day of each month
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Update Ryanair flight schedules
        run: |
          python scripts/update_flights.py
        continue-on-error: true

      - name: Update FlightRadar24 live callsigns
        run: |
          python scripts/update_callsigns.py
        continue-on-error: true

      - name: Compile multi-airline dataset
        run: |
          node scripts/build_multi_airline_dataset.js

      - name: Update metadata timestamp
        run: |
          node scripts/update_metadata.js

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flights.json ryanair_flights_lzib.json metadata.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update flight schedules and callsigns [skip ci]" && git push)
